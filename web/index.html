<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>gridmapper</title>
	<link rel="icon" type="image/png" href="/favicon.png" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
	<style>
		:root {
			/* Two colours only. */
			--bg: #ece9e1;   /* tasteful off-white */
			--ink: #15140f;  /* almost black */
			/* The grid panel + key ramp are derived from these two. */
			--panel: #0c0b09;        /* black grid body */
			--key-off: 48, 46, 42;   /* dark grey (LED level 0) */
			--key-on: 236, 233, 225; /* off-white  (LED level 15) */
		}
		* { box-sizing: border-box; }
		html, body { height: 100%; }
		body {
			margin: 0;
			background: var(--bg);
			color: var(--ink);
			font-family: "Roboto Mono", ui-monospace, monospace;
			font-weight: 400;
			-webkit-font-smoothing: antialiased;
			-webkit-user-select: none; user-select: none;
			display: flex; flex-direction: column;
		}
		header {
			display: flex; align-items: baseline; gap: 14px;
			padding: 22px 28px 16px;
		}
		header .mark { font-size: 14px; font-weight: 500; letter-spacing: .5px; }
		/* Device indicator: hollow square = no device, filled = connected. */
		header .device { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .5px; opacity: .45; cursor: pointer; }
		header .device:hover { opacity: .8; }
		header .device.on { opacity: .85; }
		header .device .dot { width: 9px; height: 9px; border-radius: 2px; border: 1px solid var(--ink); background: transparent; }
		header .device.on .dot { background: var(--ink); }
		/* Grid on the left, page settings reserved on the right. */
		main { flex: 1; display: flex; flex-direction: row; align-items: flex-start; gap: 28px; padding: 0 28px 40px; }
		.left { display: flex; flex-direction: column; gap: 16px; }
		#toolbar { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
		.group { display: flex; gap: 6px; align-items: center; }
		.group .lbl { font-size: 11px; opacity: .4; letter-spacing: 1px; text-transform: uppercase; margin-right: 4px; }
		.chip {
			font: inherit; font-size: 12px; letter-spacing: .5px;
			color: var(--ink); background: transparent;
			border: 1px solid var(--ink); border-radius: 3px;
			padding: 5px 9px; cursor: pointer; opacity: .5;
			transition: opacity .08s, background .08s;
		}
		.chip:hover { opacity: .8; }
		.chip.on { background: var(--ink); color: var(--bg); opacity: 1; }
		select.select {
			font: inherit; font-size: 12px; letter-spacing: .5px;
			color: var(--ink); background: transparent;
			border: 1px solid var(--ink); border-radius: 3px;
			padding: 5px 26px 5px 9px; cursor: pointer;
		}
		#grid {
			display: grid; gap: 6px;
			padding: 14px; background: var(--panel);
			border-radius: 8px; /* very slightly rounded */
			/* Size to the cells, never to the column. Without this the black panel
			   stretches to whatever the widest sibling below it happens to be. */
			width: max-content;
		}
		.cell {
			width: 46px; height: 46px;
			border-radius: 3px; /* very slightly rounded */
			background: rgb(var(--key-off));
			cursor: pointer;
			transition: background .06s linear;
		}
		.cell:active { transform: translateY(.5px); }
		.readout { font-size: 12px; letter-spacing: .5px; opacity: .5; min-height: 16px; }
		/* Right-hand page-settings panel (placeholder for now). */
		.settings {
			min-width: 220px; max-width: 280px;
			border: 1px solid var(--ink); border-radius: 8px;
			padding: 16px 16px 18px; opacity: .9;
		}
		.settings .title { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; opacity: .45; margin-bottom: 12px; }
		.settings .ctx { font-size: 13px; letter-spacing: .5px; margin-bottom: 10px; }
		.settings .note { font-size: 12px; letter-spacing: .3px; opacity: .45; }
		.settings .field { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0; }
		.settings .field label { font-size: 12px; letter-spacing: .3px; opacity: .7; }
		.settings input[type="number"], .settings input[type="text"] {
			font: inherit; font-size: 12px; width: 64px; text-align: right;
			color: var(--ink); background: transparent;
			border: 1px solid var(--ink); border-radius: 3px; padding: 4px 6px;
		}
		.settings input[type="checkbox"] { accent-color: var(--ink); width: 16px; height: 16px; }
		.settings select.select { padding: 4px 22px 4px 8px; }
		.settings input:disabled, .settings select:disabled { opacity: .35; cursor: not-allowed; }
		.settings .sub { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; opacity: .35; margin: 16px 0 6px; }
		.settings .sub:first-child { margin-top: 0; }
		/* Presets: one row per saved file, the active one filled in like a chip. */
		.presets { display: flex; flex-direction: column; gap: 4px; }
		.presets .row { display: flex; align-items: center; gap: 4px; }
		.presets .row .chip.name { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.presets .row .chip.del { padding: 5px 8px; opacity: .3; }
		.presets .row .chip.del:hover { opacity: .9; }
		.presets .row .chip.del.arm { background: var(--ink); color: var(--bg); opacity: 1; }
		.presets .empty { font-size: 12px; letter-spacing: .3px; opacity: .4; padding: 2px 0 4px; }
		.presetSave { display: flex; gap: 6px; margin-top: 12px; }
		.presetSave input[type="text"] { flex: 1; width: auto; text-align: left; }
		aside.col { display: flex; flex-direction: column; gap: 16px; }
		/* Page settings live under the grid and are pinned to the grid's own width (set in
		   buildGrid), so a page with many settings wraps onto more rows instead of pushing
		   the column — and the grid panel above it. */
		.settings.wide { max-width: none; align-self: flex-start; }
		.settings.wide #settingsFields { display: flex; flex-wrap: wrap; gap: 4px 24px; }
		.settings.wide .field { margin: 6px 0; flex: 0 0 auto; }
		.settings.wide select.select { max-width: 132px; }
		.settings.wide .field.enum-field { flex: 1 1 100%; min-width: 0; flex-wrap: wrap; align-items: flex-start; }
		.settings .field.enum-field label { flex: 0 0 100%; }
		.settings .enum-buttons { display: flex; flex: 1 1 auto; flex-wrap: wrap; gap: 4px; justify-content: flex-start; }
		.settings .enum-button {
			font: inherit; font-size: 11px; letter-spacing: .2px; color: var(--ink);
			background: transparent; border: 1px solid var(--ink); border-radius: 3px;
			padding: 4px 6px; cursor: pointer; opacity: .55;
		}
		.settings .enum-section { display:flex; flex-wrap:wrap; gap:4px; width:100%; margin-bottom:5px; }
		.settings .bank-title { flex:0 0 100%; font-size:11px; opacity:.7; margin:3px 0; }
		.settings .enum-button.pending { border-style:dashed; opacity:1; outline:1px dashed var(--ink); outline-offset:2px; }
		.cells-details { border-top:1px solid var(--ink); margin-top:14px; padding-top:10px; }
		.cells-heading { margin:0 0 8px; font-size:13px; }
		.cells-advice { display:flex; align-items:center; gap:10px; font-size:12px; flex-wrap:wrap; }
		.cells-note { font-size:11px; opacity:.65; margin:5px 0 12px; }
		.cells-rows { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
		.cells-row.muted .cell-choice[aria-pressed="true"], .cells-row.resting .cell-choice[aria-pressed="true"] { opacity:.45; border-style:dashed; }
		.cells-row { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
		.cells-role { flex:0 0 100%; font-size:11px; margin-top:3px; }
		/* Cells Hot panel: sections in playing order, prose you can actually read. */
		.cx-section { border-top: 1px solid rgba(21,20,15,.18); padding: 14px 0 6px; }
		.cx-section:first-child { border-top: 0; padding-top: 4px; }
		.cx-title { font-size: 13px; font-weight: 500; letter-spacing: .2px; margin: 0 0 8px; }
		.cx-nowline { font-size: 16px; font-weight: 500; margin: 2px 0 6px; }
		.cx-world-title { font-size: 13px; font-weight: 500; margin: 0 0 6px; }
		.cx-context { font-size: 13px; line-height: 1.6; max-width: 68ch; margin: 0 0 6px; }
		.cx-source { font-size: 11px; line-height: 1.5; opacity: .55; max-width: 80ch; margin: 0 0 12px; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
		.cx-help { font-size: 11px; line-height: 1.5; opacity: .55; margin: 2px 0 8px; max-width: 72ch; flex: 0 0 100%; }
		.cx-muted { font-size: 11px; opacity: .55; }
		.cx-worlds, .cx-ensembles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
		.cx-ensembles { margin-bottom: 4px; }
		.cx-world, .cx-ensemble {
			font: inherit; text-align: left; color: var(--ink); background: transparent;
			border: 1px solid rgba(21,20,15,.35); border-radius: 4px; padding: 7px 9px; cursor: pointer;
			display: flex; flex-direction: column; gap: 3px;
		}
		.cx-world:hover, .cx-ensemble:hover { border-color: var(--ink); }
		.cx-world[aria-pressed="true"], .cx-ensemble[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
		.cx-world.pending { border-style: dashed; border-color: var(--ink); }
		.cx-world-name { font-size: 12px; font-weight: 500; }
		.cx-world-sum { font-size: 11px; line-height: 1.45; opacity: .7; }
		.cx-field { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 6px 0; }
		.cx-field label { font-size: 12px; opacity: .8; }
		.cx-inline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 12px; }
		.cx-inline .cx-field { margin: 0; }
		.cx-inline .cx-field .cx-help { display: none; }
		.cx-play { min-width: 64px; }
		.cx-drag { cursor: ns-resize; touch-action: none; }
		.cx-pair { display: inline-flex; gap: 2px; }
		.cx-clear:disabled { opacity: .2; cursor: default; }
		.cx-more { margin-top: 12px; font-size: 12px; }
		.cx-more summary { cursor: pointer; opacity: .7; }
		/* Readability: full-contrast text, larger type, quieter borders instead of faded labels. */
		.cells-details { font-size: 13px; line-height: 1.5; }
		.cells-details .enum-button { font-size: 12px; padding: 5px 9px; opacity: 1; border-color: rgba(21,20,15,.3); }
		.cells-details .enum-button:hover { border-color: var(--ink); }
		.cells-details .enum-button:disabled { opacity: .35; }
		.cells-details .cx-title { font-size: 14px; }
		.cells-details .cx-help, .cells-details .cx-muted { font-size: 12px; opacity: .72; }
		.cells-details .cx-source { font-size: 11.5px; opacity: .68; }
		.cells-details .cx-context { font-size: 14px; line-height: 1.65; }
		.cells-details .cx-field label { font-size: 13px; opacity: 1; }
		.cells-details input[type="number"] { font-size: 13px; width: 76px; padding: 5px 7px; }
		.cells-details select.select { font-size: 13px; }
		.cells-details .cells-role { font-size: 12px; font-weight: 500; margin-top: 6px; }
		.cells-details .cells-rows { gap: 10px; }
		.cells-details .bank-title { font-size: 12px; opacity: .8; margin-top: 6px; }
		.cx-world-sum { font-size: 12px; line-height: 1.5; opacity: .78; }
		.cx-world-name { font-size: 13px; }
		.cx-tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid rgba(21,20,15,.25); margin: 16px 0 4px; }
		.cx-tab { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 7px 12px; cursor: pointer; opacity: .65; }
		.cx-tab:hover { opacity: 1; }
		.cx-tab[aria-selected="true"] { opacity: 1; font-weight: 500; border-bottom-color: var(--ink); }
		.cx-panel > .cx-section:first-child { border-top: 0; }
		/* Key legend over the web grid: thin dotted guides, small quiet labels. */
		#grid { position: relative; }
		#legend { position: absolute; inset: 0; pointer-events: none; }
		#legend .lg-lines { position: absolute; left: 0; top: 0; overflow: visible; }
		#legend .lg-lines .lg-dash { stroke: rgba(236,233,225,.5); stroke-width: 1.2; stroke-dasharray: 1 4; stroke-linecap: round; fill: none; }
		#legend .lg-lines circle, #legend .lg-lines path { fill: rgba(236,233,225,.7); }
		.lg-pill {
			position: absolute; transform: translate(-50%, -50%);
			background: var(--bg); color: var(--ink); border-radius: 3px;
			font-size: 10.5px; font-weight: 500; line-height: 1.2; letter-spacing: .2px;
			padding: 2px 6px; text-align: center; white-space: normal; overflow-wrap: normal;
			box-shadow: 0 0 0 1px rgba(12,11,9,.6);
			transition: background .08s, color .08s;
		}
		.lg-pill.lg-single { background: rgba(236,233,225,.9); padding: 2px 3px; font-size: 9.5px; letter-spacing: 0; }
		.lg-pill.hot { background: var(--ink); color: var(--bg); box-shadow: 0 0 0 1px rgb(var(--key-on)); }
		.readout.lg-info { opacity: 1; font-size: 13px; letter-spacing: .2px; line-height: 1.45; max-width: 740px; }
		.readout.lg-info b { font-weight: 500; }
		.settings button:focus-visible, .settings input:focus-visible, .settings select:focus-visible, .settings summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
		.settings .enum-button:hover { opacity: .85; }
		.settings .enum-button[aria-pressed="true"] { background: var(--ink); color: var(--bg); opacity: 1; }
		#clockStepLane { font: inherit; font-size: 12px; width: 38px; text-align: right;
			color: var(--ink); background: transparent;
			border: 1px solid var(--ink); border-radius: 3px; padding: 4px 6px; }
		/* Transport: a pulse dot that blinks on each clock tick (when echo is on). */
		#transport .pulse {
			width: 9px; height: 9px; border-radius: 50%;
			border: 1px solid var(--ink); background: transparent; opacity: .35;
			transition: opacity .05s linear, background .05s linear;
		}
		#transport .pulse.beat { background: var(--ink); opacity: 1; }
		#clockRate { font: inherit; font-size: 12px; width: 58px; text-align: right;
			color: var(--ink); background: transparent;
			border: 1px solid var(--ink); border-radius: 3px; padding: 4px 6px;
			cursor: ns-resize; touch-action: none; }
	</style>
</head>
<body>
	<header>
		<span class="mark">gridmapper</span>
		<span class="device" id="device"><span class="dot"></span><span id="deviceLabel">no device</span></span>
	</header>
	<main>
		<div class="left">
			<div id="toolbar">
				<div class="group" id="slotGroup"></div>
				<div class="group">
					<span class="lbl">page</span>
					<select class="select" id="pageSelect"></select>
					<button class="chip" id="keysBtn" aria-pressed="false" title="label every key on the grid">keys</button>
				</div>
				<div class="group" id="transport">
					<span class="lbl">clock</span>
					<button class="chip" id="clockRun">run</button>
					<input id="clockRate" type="number" min="0.1" max="200" step="1" title="master tick rate, ticks per second — drag to change" />
					<span class="pulse" id="clockPulse" title="tick (needs echo)"></span>
					<button class="chip" id="clockStep" title="one manual tick into the lane on the right">step</button>
					<input id="clockStepLane" type="number" min="0" max="3" step="1" value="0" title="lane to step" />
				</div>
			</div>
			<div id="grid"></div>
			<div class="readout" id="readout">&nbsp;</div>
			<div class="settings wide">
				<div class="title">page settings</div>
				<div class="ctx" id="settingsCtx">—</div>
				<div id="settingsFields"></div>
				<div class="note" id="settingsNote"></div>
			</div>
		</div>
		<aside class="col">
			<div class="settings">
				<div class="title">presets</div>
				<div class="presets" id="presetList"></div>
				<!-- Saving captures the LIVE machine: every slot's page and that page's own
				     state (settings, chords, recorded loops, routing). Max can load and
				     delete presets but deliberately cannot save one — see oscRouter.ts. -->
				<div class="presetSave">
					<input id="presetName" type="text" placeholder="name" maxlength="48" spellcheck="false" />
					<button class="chip" id="presetSave" title="capture the live machine into this preset">save</button>
				</div>
				<div class="note" id="presetNote" role="status">—</div>
			</div>
			<div class="settings">
				<div class="title">app settings</div>
				<div class="sub">clock</div>
				<div class="field"><label for="setClockRate">ticks / sec</label><input id="setClockRate" type="number" min="0.1" max="200" step="1" /></div>
				<div class="field"><label for="setClockEcho">tick echo</label><input id="setClockEcho" type="checkbox" /></div>
				<!-- Four lanes. A page picks one, and the lane decides internal vs external —
				     that's how "internal or external clock per page" works without a second clock. -->
				<div class="sub">lanes</div>
				<div id="laneRows"></div>
				<div class="sub">sleep</div>
				<div class="field"><label for="setIdleConn">after, grid (min)</label><input id="setIdleConn" type="number" min="1" max="10080" step="1" /></div>
				<div class="field"><label for="setIdleDisc">after, no grid (min)</label><input id="setIdleDisc" type="number" min="1" max="10080" step="1" /></div>
				<div class="field"><label for="setCaffeinate">caffeinate</label><input id="setCaffeinate" type="checkbox" /></div>
				<div class="note" id="idleNote">—</div>
				<div class="sub">osc (restart to apply)</div>
				<div class="field"><label>in / out</label><input id="setOscPorts" type="text" disabled /></div>
			</div>
		</aside>
	</main>

	<script>
		let W = 16, H = 8;
		const gridEl = document.getElementById("grid");
		const deviceEl = document.getElementById("device");
		const deviceLabelEl = document.getElementById("deviceLabel");
		const readoutEl = document.getElementById("readout");
		const slotGroup = document.getElementById("slotGroup");
		const pageSelect = document.getElementById("pageSelect");
		const settingsCtx = document.getElementById("settingsCtx");
		const settingsFields = document.getElementById("settingsFields");
		const settingsNote = document.getElementById("settingsNote");
		let cells = [];

		// --- Slot / page selector state ---
		const SLOT_LABELS = ["a", "b", "c", "d", "e", "f", "g", "h"];
		let pageTypes = [];            // populated from the server (auto-discovered)
		let focusedSlot = 0;
		let slotPages = SLOT_LABELS.map(() => "base");
		let specsByPage = {};                          // pageName -> SettingSpec[]
		let settingsBySlot = SLOT_LABELS.map(() => ({})); // slot index -> { key: value }
		let cellsViews = SLOT_LABELS.map(() => null);
		let keymapsByPage = {};                        // pageName -> KeySpec[]
		let legendOn = false;
		try { legendOn = localStorage.getItem("key-legend") === "1"; } catch {}
		let cellsViewSignature = "";
		const cellsPanel = document.createElement("section");
		cellsPanel.className = "cells-details"; cellsPanel.setAttribute("aria-label", "Cells performance");
		settingsFields.after(cellsPanel);

		// The page dropdown is built from whatever the daemon reports — drop a new
		// page file in src/pages/ and it appears here automatically.
		function buildPageOptions() {
			pageSelect.innerHTML = "";
			pageTypes.forEach((name) => {
				const o = document.createElement("option");
				o.value = name; o.textContent = name;
				pageSelect.appendChild(o);
			});
			pageSelect.value = slotPages[focusedSlot];
		}
		// Wire protocol uses slot LETTERS (a..h) everywhere — same dialect as Max/daemon.
		// focusedSlot stays a numeric index for local array access only.
		pageSelect.onchange = () => send("/grid/in/slot/" + SLOT_LABELS[focusedSlot] + "/page", [pageSelect.value]);

		function renderToolbar() {
			slotGroup.innerHTML = '<span class="lbl">slot</span>';
			SLOT_LABELS.forEach((lab, i) => {
				const b = document.createElement("button");
				b.className = "chip" + (i === focusedSlot ? " on" : "");
				b.textContent = lab;
				b.onclick = () => send("/grid/in/focus/page", [lab]);
				slotGroup.appendChild(b);
			});
			pageSelect.value = slotPages[focusedSlot];
			renderSettings();
		}

		// Build the right-hand panel from the focused slot's page specs + current values.
		function renderSettings() {
			const page = slotPages[focusedSlot];
			renderLegend();
			settingsCtx.textContent = `slot ${SLOT_LABELS[focusedSlot]} · ${page}`;
			if (page === "cells-hot") { cellsViewSignature = ""; renderCellsView(); return; }
			const specs = specsByPage[page] || [];
			settingsFields.innerHTML = "";
			if (!specs.length) { renderCellsView(); settingsNote.textContent = `no settings for ${page} yet`; return; }
			settingsNote.textContent = "";
			const values = settingsBySlot[focusedSlot] || {};
			const setVal = (key, v) => send(`/grid/in/page/${SLOT_LABELS[focusedSlot]}/setting/${key}`, [v]);
			specs.forEach((spec) => {
				const row = document.createElement("div"); row.className = "field" + (spec.presentation === "buttons" ? " enum-field" : "");
				const lab = document.createElement("label"); lab.textContent = spec.label || spec.key;
				const cur = values[spec.key] !== undefined ? values[spec.key] : spec.default;
				let input;
				if (spec.type === "toggle") {
					input = document.createElement("input"); input.type = "checkbox"; input.checked = !!cur;
					input.onchange = () => setVal(spec.key, input.checked ? 1 : 0);
				} else if (spec.type === "enum" && spec.presentation === "buttons") {
					input = document.createElement("div"); input.className = "enum-buttons";
					input.setAttribute("role", "group"); input.setAttribute("aria-label", spec.label || spec.key);
					const groups = new Map();
					(spec.options || []).forEach((o) => {
						const groupName = spec.optionGroups && spec.optionGroups[o];
						let destination = input;
						if (groupName) {
							if (!groups.has(groupName)) {
								const group = document.createElement("div"); group.className = "enum-section";
								group.setAttribute("role", "group"); group.setAttribute("aria-label", groupName);
								const title = document.createElement("div"); title.className = "bank-title"; title.textContent = groupName;

		// One row per lane: source + divisor. Rebuilt only when the shape changes, so

					const src = document.createElement("select"); src.className = "select";
					["internal", "external"].forEach((o) => {
						const op = document.createElement("option"); op.value = o; op.textContent = o; src.appendChild(op);
					});
					src.onchange = () => setSetting(`clock/lanes/${i}/source`, src.value);
					const div = document.createElement("input");
					div.type = "number"; div.min = 1; div.max = 64; div.step = 1; div.title = "÷ master";
					div.style.width = "48px";
					div.onchange = () => { const v = Number(div.value); if (Number.isFinite(v)) setSetting(`clock/lanes/${i}/div`, v); };
					row.append(lab, src, div);
					laneRowsEl.appendChild(row);
				});
			}
			lanes.forEach((lane, i) => {
				const row = laneRowsEl.children[i];
				const [, src, div] = row.children;
				if (document.activeElement !== src) src.value = lane.source;
				if (document.activeElement !== div) div.value = lane.div;
				// An external lane ignores the master, so its divisor is meaningless.
				div.disabled = lane.source === "external";
			});
		}

		let pulseTimer = null;
		function pulse() {
			clockPulseEl.classList.add("beat");
			clearTimeout(pulseTimer);
			pulseTimer = setTimeout(() => clockPulseEl.classList.remove("beat"), 60);
		}

		// App settings panel — same "don't fight the user's cursor" rule as above.
		const appFields = [
			["setClockRate", "clock/rate", (s) => s.clock.rate, "number"],
			["setClockEcho", "clock/echo", (s) => s.clock.echo, "check"],
			["setIdleConn", "idle/connectedMin", (s) => s.idle.connectedMin, "number"],
			["setIdleDisc", "idle/disconnectedMin", (s) => s.idle.disconnectedMin, "number"],
			["setCaffeinate", "idle/caffeinate", (s) => s.idle.caffeinate, "check"],
		];
		appFields.forEach(([id, path, , kind]) => {
			const input = el(id);
			input.onchange = () => {
				if (kind === "check") setSetting(path, input.checked ? 1 : 0);
				else if (kind === "select") setSetting(path, input.value);
				else { const v = Number(input.value); if (Number.isFinite(v)) setSetting(path, v); }
			};
		});

		function renderAppSettings() {
			if (!appSettings) return;
			appFields.forEach(([id, , read, kind]) => {
				const input = el(id);
				if (document.activeElement === input) return;
				const v = read(appSettings);
				if (kind === "check") input.checked = !!v; else input.value = v;
			});
			el("setOscPorts").value = `${appSettings.osc.inPort} / ${appSettings.osc.outPort}`;
		}

		// --- presets ---------------------------------------------------------------
		// A preset is the eight slots and each page's own state. The daemon owns the files;
		// this panel is just the one surface allowed to CREATE them.
		const PRESET_NAME_RE = /^[A-Za-z0-9 _-]{1,48}$/;
		let presetNames = [];
		let activePreset = "";
		let armedDelete = null; // click × once to arm, again to confirm — no modal dialogs

		function renderPresets() {
			const list = el("presetList");
			list.textContent = "";
			if (!presetNames.length) {
				const empty = document.createElement("div");
				empty.className = "empty";
				empty.textContent = "none saved yet";
				list.append(empty);
			}
			for (const name of presetNames) {
				const row = document.createElement("div");
				row.className = "row";

				const load = document.createElement("button");
				load.className = "chip name" + (name === activePreset ? " on" : "");
				load.textContent = name;
				load.title = `recall "${name}" — restore all eight slots and their page state`;
				load.onclick = () => { armedDelete = null; send("/grid/in/preset/load", [name]); };

				const recall = document.createElement("button");
				recall.className = "chip";
				recall.textContent = "recall";
				recall.setAttribute("aria-label", `recall ${name}`);
				recall.title = load.title;
				recall.onclick = load.onclick;

				const del = document.createElement("button");
				del.className = "chip del" + (armedDelete === name ? " arm" : "");
				del.textContent = "×";
				del.title = armedDelete === name ? "click again to delete" : `delete "${name}"`;
				del.onclick = () => {
					if (armedDelete === name) { armedDelete = null; send("/grid/in/preset/delete", [name]); }
					else { armedDelete = name; renderPresets(); }
				};

				row.append(load, recall, del);
				list.append(row);
			}
			el("presetNote").textContent = activePreset
				? `active: ${activePreset}`
				: presetNames.length ? "no preset active · choose recall" : "save the current machine";
		}

		function savePreset() {
			const input = el("presetName");
			const name = input.value.trim();
			if (!PRESET_NAME_RE.test(name)) {
				el("presetNote").textContent = "name: letters, digits, space, _ or -";
				return;
			}
			// Overwriting is the point of a name you already used, but say so out loud.
			if (presetNames.includes(name) && !confirm(`Overwrite the preset "${name}"?`)) return;
			send("/grid/in/preset/save", [name]);
			input.value = "";
			armedDelete = null;
		}

		el("presetSave").onclick = savePreset;
		el("presetName").onkeydown = (e) => { if (e.key === "Enter") savePreset(); };
		// Typing a name that exists turns save into an overwrite; hint at it.
		el("presetName").oninput = () => {
			const name = el("presetName").value.trim();
			el("presetSave").textContent = presetNames.includes(name) ? "overwrite" : "save";
		};

		function renderIdle(s) {
			const mins = Math.round(s.sleepAfterMs / 60000);
			idleNoteEl.textContent = s.caffeinated
				? "awake — caffeinated"
				: `${s.asleep ? "asleep" : "awake"} · sleeps after ${mins} min ${s.connected ? "(grid)" : "(no grid)"}`;
		}

		function setDevice(label) { deviceLabelEl.textContent = label; deviceEl.classList.add("on"); }
		function clearDevice() { deviceLabelEl.textContent = "no device"; deviceEl.classList.remove("on"); }
		// Click the indicator to force a connection attempt.
		deviceEl.title = "click to connect";
		deviceEl.onclick = () => {
			// Always allowed — forces a fresh handshake (useful after a real unplug).
			deviceLabelEl.textContent = "connecting…";
			send("/grid/in/connect", []);
		};

		// LED ramp: level 0..15 → dark grey … off-white (linear per channel).
		const OFF = [48, 46, 42];
		const ON = [236, 233, 225];
		function levelColor(level) {
			const t = Math.max(0, Math.min(15, level)) / 15;
			const c = OFF.map((o, i) => Math.round(o + (ON[i] - o) * t));
			return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
		}

		gridEl.addEventListener("mouseleave", () => { if (!legendHot) showLegendInfo(null); });
		function buildGrid(w, h) {
			W = w; H = h;
			gridEl.style.gridTemplateColumns = `repeat(${w}, 46px)`;
			gridEl.innerHTML = "";
			cells = [];
			for (let y = 0; y < h; y++) {
				for (let x = 0; x < w; x++) {
					const c = document.createElement("div");
					c.className = "cell";
					c.dataset.x = x; c.dataset.y = y;
					c.addEventListener("mouseenter", () => showLegendInfo(legendOwner[y * w + x]));
					gridEl.appendChild(c);
					cells.push(c);
				}
			}
			// Measure rather than hardcode, so a differently-sized grid still lines up.
			requestAnimationFrame(() => {
				const panel = document.querySelector(".settings.wide");
				if (panel) panel.style.width = `${gridEl.offsetWidth}px`;
				renderLegend();
			});
		}

		function paint(levels) {
			for (let i = 0; i < cells.length && i < levels.length; i++) {
				cells[i].style.background = levelColor(levels[i]);
			}
		}

		// --- WebSocket: same { path, args } protocol as OSC ---
		let ws;
		function connect() {
			ws = new WebSocket(`ws://${location.host}`);
			ws.onclose = () => { clearDevice(); setTimeout(connect, 800); };
			ws.onmessage = (ev) => {
				let m; try { m = JSON.parse(ev.data); } catch { return; }
				switch (m.path) {
					case "/grid/out/device":
						// "null-grid" = no real hardware → show as disconnected (clickable).
						if (m.args[0] === "null-grid") clearDevice();
						else setDevice(`${m.args[0]} · ${m.args[1]}×${m.args[2]}`);
						break;
					case "/grid/out/size": buildGrid(m.args[0], m.args[1]); break;
					case "/grid/out/pagetypes": pageTypes = m.args; buildPageOptions(); break;
					case "/grid/out/pagekeys": { try { keymapsByPage = JSON.parse(m.args[0]); } catch {} renderLegend(); break; }
					case "/grid/out/keyecho": legendKey(m.args[0], m.args[1], m.args[2]); break;
					case "/grid/out/pagespecs": { try { specsByPage = JSON.parse(m.args[0]); } catch {} renderSettings(); break; }
					case "/grid/out/focus/page": { const i = SLOT_LABELS.indexOf(m.args[0]); if (i >= 0) focusedSlot = i; renderToolbar(); requestCellsView(); break; }
					case "/grid/out/slots": slotPages = m.args; renderToolbar(); requestCellsView(); break;
					case "/grid/out/clock": { try { clockState = JSON.parse(m.args[0]); } catch {} renderTransport(); break; }
					// [lane, n] — blink on lane 0 only, or four lanes would strobe at once.
					case "/grid/out/clock/tick": if (Number(m.args[0]) === 0) pulse(); break;
					case "/grid/out/idle": { try { renderIdle(JSON.parse(m.args[0])); } catch {} break; }
					case "/grid/out/settings": { try { appSettings = JSON.parse(m.args[0]); } catch {} renderAppSettings(); break; }
					case "/grid/out/preset/list": presetNames = m.args.map(String); armedDelete = null; renderPresets(); break;
					// "" = no preset active: a failed load, or the layout was edited since.
					case "/grid/out/preset/active": activePreset = m.args[0] ? String(m.args[0]) : ""; renderPresets(); break;
					case "/grid/out/leds": {
						const [w, h, ...levels] = m.args;
						if (w !== W || h !== H || cells.length !== w * h) buildGrid(w, h);
						paint(levels);
						break;
					}
					default: {
						const vm = m.path.match(/^\/grid\/out\/page\/([a-h])\/view$/);
						if (vm) {
							try { const idx=SLOT_LABELS.indexOf(vm[1]); cellsViews[idx]=JSON.parse(m.args[0]); if(idx===focusedSlot) { renderCellsView(); renderLegend(); } } catch {}
							break;
						}
						const pm = m.path.match(/^\/grid\/out\/page\/([a-h])\/patterns$/);
						if (pm) {
							try { const idx=SLOT_LABELS.indexOf(pm[1]); patternsBySlot[idx]=JSON.parse(m.args[0]); if(idx===focusedSlot) renderCellsView(); } catch {}
							break;
						}
						// /grid/out/page/<slot>/settings <json> — slot is a letter (a..h).
						const sm = m.path.match(/^\/grid\/out\/page\/([a-h])\/settings$/);
						if (sm) {
							const idx = SLOT_LABELS.indexOf(sm[1]);
							let vals = {}; try { vals = JSON.parse(m.args[0]); } catch {}
							if (idx >= 0) { settingsBySlot[idx] = vals; if (idx === focusedSlot) renderSettings(); }
						}
						break;
					}
				}
			};
		}

		function send(path, args) {
			if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ path, args }));
		}
		const sendKey = (x, y, s) => send("/grid/in/key", [x, y, s]);

		// Pointer interaction. A cell is "held" while the pointer is on it; moving onto
		// another cell releases the previous one after a tiny delay (a short tail so each
		// note rings) — so click-dragging across the grid plays it like an instrument.
		// A plain click is a brief tap; holding without moving stays held until release
		// (so you can hold the sustain key, etc).
		const RELEASE_DELAY = 90; // ms tail before key-up
		let dragging = false;
		let activeIdx = -1;
		const downSet = new Set();        // idx currently sent down (awaiting up)
		const pendingUp = new Map();      // idx -> scheduled key-up timeout
		const idxOf = (x, y) => y * W + x;
		const cellFrom = (t) => (t && t.classList && t.classList.contains("cell"))
			? { x: +t.dataset.x, y: +t.dataset.y } : null;

		function pressCell(c) {
			const idx = idxOf(c.x, c.y);
			if (idx === activeIdx) return;
			const t = pendingUp.get(idx);            // re-entered before its tail expired
			if (t) { clearTimeout(t); pendingUp.delete(idx); } // still down — keep it
			if (!downSet.has(idx)) { sendKey(c.x, c.y, 1); downSet.add(idx); }
			activeIdx = idx;
			readoutEl.textContent = `${String(c.x).padStart(2)} , ${String(c.y).padStart(2)}  down`;
		}
		function releaseCell(idx, delay) {
			if (idx < 0 || !downSet.has(idx) || pendingUp.has(idx)) return;
			const x = idx % W, y = Math.floor(idx / W);
			pendingUp.set(idx, setTimeout(() => {
				sendKey(x, y, 0); downSet.delete(idx); pendingUp.delete(idx);
			}, delay));
		}

		gridEl.addEventListener("pointerdown", (e) => {
			const c = cellFrom(e.target); if (!c) return;
			dragging = true;
			pressCell(c);
		});
		window.addEventListener("pointermove", (e) => {
			if (!dragging) return;
			const c = cellFrom(e.target); if (!c) return;
			if (idxOf(c.x, c.y) === activeIdx) return;
			const prev = activeIdx;
			activeIdx = -1;
			releaseCell(prev, RELEASE_DELAY);
			pressCell(c);
		});
		window.addEventListener("pointerup", () => {
			if (!dragging) return;
			dragging = false;
			releaseCell(activeIdx, RELEASE_DELAY);
			activeIdx = -1;
		});

		renderToolbar();
		renderTransport();
		buildGrid(W, H);
		connect();
	</script>
</body>
</html>
